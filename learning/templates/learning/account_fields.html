{% if form.non_field_errors %}
  <div class="form-alert" role="alert">{{ form.non_field_errors }}</div>
{% endif %}
{% for field in form %}
  <div class="form-field">
    {{ field.label_tag }}
    {{ field }}
    {% if field.help_text %}<div class="helptext" id="{{ field.auto_id }}_helptext">{{ field.help_text|safe }}</div>{% endif %}
    {% if field.errors %}<div role="alert">{{ field.errors }}</div>{% endif %}
  </div>
{% endfor %}
