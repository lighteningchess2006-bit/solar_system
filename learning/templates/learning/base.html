{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Study Hub{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'learning/study.css' %}">
</head>
<body>
  <header>
    <a class="brand" href="{% url 'learning:home' %}">Study Hub<span>A little curiosity, every day.</span></a>
    <nav aria-label="Account">
      {% if user.is_authenticated %}
        <form method="post" action="{% url 'learning:logout' %}">
          {% csrf_token %}
          <button class="button" type="submit">Log out</button>
        </form>
      {% else %}
        <a href="{% url 'learning:login' %}">Log in</a>
        <a class="button" href="{% url 'learning:signup' %}">Sign up</a>
      {% endif %}
    </nav>
  </header>
  <main>{% block content %}{% endblock %}</main>
  <footer>Your space to learn, explore and ask questions.</footer>
</body>
</html>
